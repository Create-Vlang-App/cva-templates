name: CI Extensions (L2)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Generate extension matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scripts/ci/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install CI helpers
        run: pip install -r scripts/ci/requirements.txt

      - name: Generate L2 matrix
        id: set
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${BASE_REF}"
            git fetch origin "${BASE_REF}" --depth=1 || true
            python scripts/ci/generate-matrix.py --layer extensions --changed-only --base-ref "$BASE"
          else
            python scripts/ci/generate-matrix.py --layer extensions
          fi

  extensions:
    name: ${{ matrix.cell.id }}
    needs: generate
    if: needs.generate.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.generate.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up V
        uses: vlang/setup-v@2c790c60223ed135f6949d1358675e4fd004b801 # v1
        with:
          stable: true
          cache: true

      - name: Cache V modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.vmodules
          key: vmodules-${{ hashFiles('**/v.mod') }}
          restore-keys: |
            vmodules-

      - name: Install Python helpers
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scripts/ci/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install CI helpers
        run: pip install -r scripts/ci/requirements.txt

      - name: Install published create-vlang-app CLI
        run: bash scripts/ci/install-cva-cli.sh

      - name: Scaffold check (template + addon)
        env:
          CI: "true"
          CVA_SKIP_GIT: "1"
        run: |
          python scripts/ci/run-scaffold-check.py \
            --template-url "${{ matrix.cell.templateUrl }}" \
            --addon-url "${{ matrix.cell.addons[0] }}" \
            --workdir "${{ runner.temp }}/cva-l2"
