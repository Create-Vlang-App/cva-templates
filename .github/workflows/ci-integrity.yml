name: CI Integrity (L0)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrity:
    name: Registry + profiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scripts/ci/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install CI helpers
        run: pip install -r scripts/ci/requirements.txt

      - name: Validate templates.json (schema + on-disk paths)
        run: python scripts/ci/validate-registry.py

      - name: Validate curated CI profiles
        run: python scripts/ci/generate-matrix.py --layer validate-profiles

      - name: Template compile smoke
        uses: vlang/setup-v@2c790c60223ed135f6949d1358675e4fd004b801 # v1
        with:
          stable: true
          cache: true

      - name: Cache V modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vmodules
          key: vmodules-${{ hashFiles('**/v.mod') }}
          restore-keys: |
            vmodules-

      - name: v test all templates
        run: |
          set -euo pipefail
          for dir in templates/*/; do
            echo "Testing $dir"
            (
              cd "$dir"
              if grep -E "dependencies: \[[^]]+" v.mod | grep -vq '\[\]'; then
                v install
                bash "${{ github.workspace }}/scripts/ci/normalize-vmodules.sh"
              fi
              v test .
            )
          done
